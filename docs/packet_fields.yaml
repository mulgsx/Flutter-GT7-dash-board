meta:
  game: "Gran Turismo 7"
  protocol: UDP
  endian: little
  encryption: salsa20
  receive_port: 33740
  send_port: 33739
  heartbeat_interval_packets: 100
  frequency_hz: 60
  encryption_detail:
    key_string: "Simulator Interface Packet GT7 ver 0.0"
    key_length: 32
    iv1_offset_hex: "0x40"
    # nonce(8byte) = iv2(4byte) + iv1(4byte)
    # iv2 = iv1 XOR xor_constant
  packet_types:
    A:
      heartbeat_char: "A"
      size_bytes: 296
      xor_constant: "0xDEADBEAF"
      availability_ja: 全モード利用可能
      availability_en: Available in all modes

fields:

  # --- Physics / 物理演算（座標・速度・回転）---

  - name: position_x
    description_ja: 車両位置（X座標）
    description_en: Vehicle position (X axis)
    category: physics
    offset_hex: "0x04"
    offset_dec: 4
    size: 4
    struct: "f"
    dart_type: double
    unit: m

  - name: position_y
    description_ja: 車両位置（Y座標）
    description_en: Vehicle position (Y axis)
    category: physics
    offset_hex: "0x08"
    offset_dec: 8
    size: 4
    struct: "f"
    dart_type: double
    unit: m

  - name: position_z
    description_ja: 車両位置（Z座標）
    description_en: Vehicle position (Z axis)
    category: physics
    offset_hex: "0x0C"
    offset_dec: 12
    size: 4
    struct: "f"
    dart_type: double
    unit: m

  - name: velocity_x
    description_ja: 速度（X軸）
    description_en: World velocity (X axis)
    category: physics
    offset_hex: "0x10"
    offset_dec: 16
    size: 4
    struct: "f"
    dart_type: double
    unit: m/s

  - name: rotation_pitch
    description_ja: 回転ピッチ角（範囲 -1〜1）
    description_en: Rotation pitch angle (range -1 to 1)
    category: physics
    offset_hex: "0x1C"
    offset_dec: 28
    size: 4
    struct: "f"
    dart_type: double
    range: [-1.0, 1.0]

  - name: rotation_yaw
    description_ja: 回転ヨー角・方位角（範囲 -1〜1）
    description_en: Rotation yaw / heading angle (range -1 to 1)
    category: physics
    offset_hex: "0x20"
    offset_dec: 32
    size: 4
    struct: "f"
    dart_type: double
    range: [-1.0, 1.0]

  - name: rotation_roll
    description_ja: 回転ロール角（範囲 -1〜1）
    description_en: Rotation roll angle (range -1 to 1)
    category: physics
    offset_hex: "0x24"
    offset_dec: 36
    size: 4
    struct: "f"
    dart_type: double
    range: [-1.0, 1.0]

  - name: angular_velocity_x
    description_ja: 角速度（X軸、範囲 -1〜1）
    description_en: Angular velocity around X axis (range -1 to 1)
    category: physics
    offset_hex: "0x2C"
    offset_dec: 44
    size: 4
    struct: "f"
    dart_type: double
    unit: rad/s
    range: [-1.0, 1.0]

  # --- Suspension & Tyres / サスペンション & タイヤ ---

  - name: ride_height
    description_ja: 車体最低地上高
    description_en: Vehicle body height / ride height
    category: suspension
    offset_hex: "0x38"
    offset_dec: 56
    size: 4
    struct: "f"
    dart_type: double
    unit: m

  - name: tyre_temp_FL
    description_ja: タイヤ温度（左前）
    description_en: Tyre temperature - Front Left
    category: suspension
    offset_hex: "0x60"
    offset_dec: 96
    size: 4
    struct: "f"
    dart_type: double
    unit: "°C"

  - name: tyre_temp_FR
    description_ja: タイヤ温度（右前）
    description_en: Tyre temperature - Front Right
    category: suspension
    offset_hex: "0x64"
    offset_dec: 100
    size: 4
    struct: "f"
    dart_type: double
    unit: "°C"

  - name: tyre_temp_RL
    description_ja: タイヤ温度（左後）
    description_en: Tyre temperature - Rear Left
    category: suspension
    offset_hex: "0x68"
    offset_dec: 104
    size: 4
    struct: "f"
    dart_type: double
    unit: "°C"

  - name: tyre_temp_RR
    description_ja: タイヤ温度（右後）
    description_en: Tyre temperature - Rear Right
    category: suspension
    offset_hex: "0x6C"
    offset_dec: 108
    size: 4
    struct: "f"
    dart_type: double
    unit: "°C"

  - name: tyre_speed_FL
    description_ja: タイヤ角速度（左前）
    description_en: Tyre angular velocity - Front Left (wheelRPS)
    category: suspension
    offset_hex: "0xA4"
    offset_dec: 164
    size: 4
    struct: "f"
    dart_type: double
    unit: rad/s

  - name: tyre_radius_FL
    description_ja: タイヤ半径（左前）
    description_en: Tyre radius - Front Left
    category: suspension
    offset_hex: "0xB4"
    offset_dec: 180
    size: 4
    struct: "f"
    dart_type: double
    unit: m

  - name: suspension_FL
    description_ja: サスペンションストローク（左前）
    description_en: Suspension height / stroke - Front Left
    category: suspension
    offset_hex: "0xC4"
    offset_dec: 196
    size: 4
    struct: "f"
    dart_type: double
    unit: m

  # --- Engine & Vehicle / 車両情報 & エンジン ---

  - name: rpm
    description_ja: エンジン回転数
    description_en: Engine RPM
    category: engine
    offset_hex: "0x3C"
    offset_dec: 60
    size: 4
    struct: "f"
    dart_type: double
    unit: rpm
    range: [0, 20000]

  - name: car_speed
    description_ja: 車速（m/s）。km/h は computed.speed_kph を参照
    description_en: Car speed in m/s. See computed.speed_kph for km/h
    category: engine
    offset_hex: "0x4C"
    offset_dec: 76
    size: 4
    struct: "f"
    dart_type: double
    unit: m/s
    range: [0, null]

  - name: rpm_rev_warning
    description_ja: レブ警告開始RPM
    description_en: RPM at which rev warning starts
    category: engine
    offset_hex: "0x88"
    offset_dec: 136
    size: 2
    struct: "H"
    dart_type: int
    unit: rpm

  - name: rpm_rev_limiter
    description_ja: RPMリミッター値
    description_en: Rev limiter RPM
    category: engine
    offset_hex: "0x8A"
    offset_dec: 138
    size: 2
    struct: "H"
    dart_type: int
    unit: rpm

  - name: estimated_top_speed
    description_ja: 現在のギア設定での推定最高速度
    description_en: Estimated top speed based on current transmission settings
    category: engine
    offset_hex: "0x8C"
    offset_dec: 140
    size: 2
    struct: "h"
    dart_type: int
    unit: km/h

  - name: gear_ratios
    description_ja: ギア比（1速〜8速）。0x104 から 4byte × 8個
    description_en: Gear ratios for gears 1-8. 4 bytes x 8 entries from offset 0x104
    category: engine
    offset_hex: "0x104"
    offset_dec: 260
    size: 32
    struct: "8f"
    dart_type: "List<double>"
    count: 8

  - name: car_id
    description_ja: 車両識別コード
    description_en: Car identification code
    category: engine
    offset_hex: "0x124"
    offset_dec: 292
    size: 4
    struct: "i"
    dart_type: int

  # --- Fluid & Temperature / 流体 & 温度 ---

  - name: current_fuel
    description_ja: 現在の燃料残量
    description_en: Current fuel level
    category: fluid
    offset_hex: "0x44"
    offset_dec: 68
    size: 4
    struct: "f"
    dart_type: double
    unit: L

  - name: fuel_capacity
    description_ja: 燃料タンク容量（ガソリン≒100 / カート≒5 / EV=0）
    description_en: Max fuel capacity. Combustion~100 / Kart~5 / EV=0
    category: fluid
    offset_hex: "0x48"
    offset_dec: 72
    size: 4
    struct: "f"
    dart_type: double
    unit: L

  - name: boost
    description_ja: ターボ圧（+1オフセット。実圧kPa = (boost-1.0)x100）
    description_en: Boost pressure with +1 offset. Actual kPa = (boost - 1.0) * 100
    category: fluid
    offset_hex: "0x50"
    offset_dec: 80
    size: 4
    struct: "f"
    dart_type: double

  - name: oil_pressure
    description_ja: 油圧
    description_en: Oil pressure
    category: fluid
    offset_hex: "0x54"
    offset_dec: 84
    size: 4
    struct: "f"
    dart_type: double
    unit: bar

  - name: water_temp
    description_ja: 水温（常時85固定）
    description_en: Water temperature (always fixed at 85)
    category: fluid
    offset_hex: "0x58"
    offset_dec: 88
    size: 4
    struct: "f"
    dart_type: double
    unit: "°C"
    constant: 85.0

  - name: oil_temp
    description_ja: 油温（常時110固定）
    description_en: Oil temperature (always fixed at 110)
    category: fluid
    offset_hex: "0x5C"
    offset_dec: 92
    size: 4
    struct: "f"
    dart_type: double
    unit: "°C"
    constant: 110.0

  # --- Timing & Race State / タイミング & レース状態 ---

  - name: package_id
    description_ja: パケット連番ID
    description_en: Packet sequence ID
    category: timing
    offset_hex: "0x70"
    offset_dec: 112
    size: 4
    struct: "i"
    dart_type: int

  - name: current_lap
    description_ja: 現在のラップ番号
    description_en: Current lap number
    category: timing
    offset_hex: "0x74"
    offset_dec: 116
    size: 2
    struct: "h"
    dart_type: int

  - name: total_laps
    description_ja: 総ラップ数
    description_en: Total number of laps
    category: timing
    offset_hex: "0x76"
    offset_dec: 118
    size: 2
    struct: "h"
    dart_type: int

  - name: best_lap
    description_ja: ベストラップタイム（ms、未設定=-1）
    description_en: Best lap time in ms. -1 if not set
    category: timing
    offset_hex: "0x78"
    offset_dec: 120
    size: 4
    struct: "i"
    dart_type: int
    unit: ms

  - name: last_lap
    description_ja: 直前ラップタイム（ms、未設定=-1）
    description_en: Last lap time in ms. -1 if not set
    category: timing
    offset_hex: "0x7C"
    offset_dec: 124
    size: 4
    struct: "i"
    dart_type: int
    unit: ms

  - name: time_on_track
    description_ja: トラック上の合計時間
    description_en: Total time on track
    category: timing
    offset_hex: "0x80"
    offset_dec: 128
    size: 4
    struct: "i"
    dart_type: int
    unit: ms

  - name: current_position
    description_ja: 現在の順位（レース前=-1）
    description_en: Current race position. -1 before race start
    category: timing
    offset_hex: "0x84"
    offset_dec: 132
    size: 2
    struct: "h"
    dart_type: int

  - name: total_positions
    description_ja: 総出場台数（レース前=-1）
    description_en: Total number of cars. -1 before race start
    category: timing
    offset_hex: "0x86"
    offset_dec: 134
    size: 2
    struct: "h"
    dart_type: int

  # --- Input & Pedals / 入力 & ペダル ---

  - name: throttle
    description_ja: アクセル入力（0=全閉 / 255=全開）
    description_en: Throttle input (0=fully closed / 255=fully open)
    category: input
    offset_hex: "0x91"
    offset_dec: 145
    size: 1
    struct: "B"
    dart_type: int
    range: [0, 255]

  - name: brake
    description_ja: ブレーキ入力（0=踏んでいない / 255=最大制動）
    description_en: Brake input (0=not pressed / 255=maximum braking)
    category: input
    offset_hex: "0x92"
    offset_dec: 146
    size: 1
    struct: "B"
    dart_type: int
    range: [0, 255]

  - name: clutch
    description_ja: クラッチペダル位置（0.0=完全切断 / 1.0=完全接続）
    description_en: Clutch pedal position (0.0=fully disengaged / 1.0=fully engaged)
    category: input
    offset_hex: "0xF4"
    offset_dec: 244
    size: 4
    struct: "f"
    dart_type: double
    range: [0.0, 1.0]

bit_fields:

  - name: simulator_flags
    description_ja: ゲーム・車両状態フラグ（ビットフィールド）
    description_en: Game and vehicle state flags (bit field)
    offset_hex: "0x8E"
    offset_dec: 142
    size: 1
    struct: "B"
    dart_type: int
    dart_class: SimulatorFlags
    bits:
      - bit: 0
        name: car_on_track
        dart_type: bool
        description_ja: コース上にいる
        description_en: Car is on track
      - bit: 1
        name: is_paused
        dart_type: bool
        description_ja: ポーズ中
        description_en: Game is paused
      - bit: 2
        name: is_loading
        dart_type: bool
        description_ja: ロード中
        description_en: Loading or processing
      - bit: 3
        name: in_gear
        dart_type: bool
        description_ja: ギアが入っている
        description_en: Car is in gear
      - bit: 4
        name: has_turbo
        dart_type: bool
        description_ja: ターボ装備車
        description_en: Car has turbo
      - bit: 5
        name: rev_limit_alert
        dart_type: bool
        description_ja: レブリミット警告中
        description_en: Rev limit alert is active
      - bit: 6
        name: handbrake_active
        dart_type: bool
        description_ja: ハンドブレーキ ON
        description_en: Handbrake is engaged
      - bit: 7
        name: lights_active
        dart_type: bool
        description_ja: ライト点灯中
        description_en: Lights are on
      - bit: 8
        name: high_beams_active
        dart_type: bool
        description_ja: ハイビーム点灯中
        description_en: High beams are on
      - bit: 9
        name: low_beams_active
        dart_type: bool
        description_ja: ロービーム点灯中
        description_en: Low beams are on
      - bit: 10
        name: asm_active
        dart_type: bool
        description_ja: ASM（横滑り防止）作動中
        description_en: ASM (stability management) is active
      - bit: 11
        name: tcs_active
        dart_type: bool
        description_ja: TCS（トラクションコントロール）作動中
        description_en: TCS (traction control) is active

  - name: gears
    description_ja: ギア情報（現在ギアと推奨ギアを1バイトにパック）
    description_en: Gear byte packing current gear and suggested gear
    offset_hex: "0x90"
    offset_dec: 144
    size: 1
    struct: "B"
    dart_type: int
    extraction:
      current_gear:
        dart_type: int
        formula: "value & 0x0F"
        description_ja: 現在のギア（下位4ビット。0=N/R, 1〜8=前進）
        description_en: Current gear from lower 4 bits (0=N/R, 1-8=forward)
      suggested_gear:
        dart_type: int
        formula: "value >> 4"
        description_ja: 推奨ギア（上位4ビット。提示なし=15）
        description_en: Suggested gear from upper 4 bits (15=no suggestion)

computed:

  - name: speed_kph
    description_ja: 車速（km/h換算）
    description_en: Car speed in km/h
    dart_type: double
    unit: km/h
    formula: "car_speed * 3.6"
    depends_on: [car_speed]

  - name: speed_mph
    description_ja: 車速（mph換算）
    description_en: Car speed in mph
    dart_type: double
    unit: mph
    formula: "car_speed * 2.237"
    depends_on: [car_speed]

  - name: boost_kpa
    description_ja: ターボ圧（kPa換算）
    description_en: Boost pressure in kPa
    dart_type: double
    unit: kPa
    formula: "(boost - 1.0) * 100.0"
    depends_on: [boost]

  - name: tyre_linear_speed_FL
    description_ja: タイヤ線速度・左前（m/s）
    description_en: Tyre linear speed - Front Left (m/s)
    dart_type: double
    unit: m/s
    formula: "tyre_speed_FL * tyre_radius_FL"
    depends_on: [tyre_speed_FL, tyre_radius_FL]

  - name: tyre_slip_ratio_FL
    description_ja: タイヤスリップ比・左前（0=スリップなし）
    description_en: Tyre slip ratio - Front Left (0=no slip)
    dart_type: double
    formula: "(tyre_linear_speed_FL - car_speed) / car_speed"
    depends_on: [tyre_linear_speed_FL, car_speed]

  - name: fuel_ratio
    description_ja: 燃料残量割合（0.0〜1.0）
    description_en: Fuel level ratio (0.0 to 1.0)
    dart_type: double
    range: [0.0, 1.0]
    formula: "current_fuel / fuel_capacity"
    depends_on: [current_fuel, fuel_capacity]

  - name: powertrain_type
    description_ja: パワートレイン種別（fuel_capacityから推定）
    description_en: Powertrain type estimated from fuel_capacity
    dart_type: String
    formula: "fuel_capacity==0 -> electric / <=5 -> kart / else -> combustion"
    depends_on: [fuel_capacity]

  - name: throttle_normalized
    description_ja: アクセル開度（0.0〜1.0に正規化）
    description_en: Throttle normalized to 0.0-1.0
    dart_type: double
    range: [0.0, 1.0]
    formula: "throttle / 255.0"
    depends_on: [throttle]

  - name: brake_normalized
    description_ja: ブレーキ踏力（0.0〜1.0に正規化）
    description_en: Brake input normalized to 0.0-1.0
    dart_type: double
    range: [0.0, 1.0]
    formula: "brake / 255.0"
    depends_on: [brake]
